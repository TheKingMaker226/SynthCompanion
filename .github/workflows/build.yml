name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decompresser le projet
        run: unzip -q SynthCompanion.zip -d projet

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Compiler l'APK
        working-directory: projet/SynthCompanion
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Synth Companion ${{ github.run_number }}
          files: projet/SynthCompanion/app/build/outputs/apk/debug/app-debug.apk
